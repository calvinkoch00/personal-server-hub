name: Test & Deploy Lambda to AWS

on:
  push:
    branches:
      - main
    paths:
      - 'aws_lambda/**'
      - 'tests/**'
      - 'requirements.txt'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Test Dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run Pytest
        run: pytest tests/

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Lambda Platform Dependencies
        run: |
          mkdir build
          cp -r aws_lambda/* build/
          pip install \
            --platform manylinux2014_x86_64 \
            --target=build \
            --implementation cp \
            --python-version 3.12 \
            --only-binary=:all: \
            -r requirements.txt

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Package Lambda Function
        run: |
          cd build
          zip -r ../function.zip .
          cd ..

      - name: Deploy Code to AWS Lambda
        run: |
          aws lambda update-function-code \
            --function-name hetzner-server-controller \
            --zip-file fileb://function.zip