name: Deploy Hetzner Server Controller & Discord Commands

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check for Discord Script Changes
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          files: |
            scripts/register_discord_commands.py

      - name: Register Discord Commands & Update Cache
        # Läuft bei Änderungen am Skript ODER manuellem Trigger
        if: steps.changed-files.outputs.any_changed == 'true' || github.event_name == 'workflow_dispatch'
        env:
          DISCORD_APPLICATION_ID: ${{ secrets.DISCORD_APPLICATION_ID }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: |
          echo "Changes detected: updating Discord commands and building cache..."
          python3 scripts/register_discord_commands.py

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --target ./package -r requirements.txt
          # Kopiert aws_lambda inklusive der commands_cache.txt in das Paket
          cp -r aws_lambda/* ./package/

      - name: Create Deployment Package
        run: |
          cd package
          zip -r ../deployment_package.zip .
          cd ..

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: Deploy to AWS Lambda
        run: |
          aws lambda update-function-code \
            --function-name hetzner-server-controller \
            --zip-file fileb://deployment_package.zip