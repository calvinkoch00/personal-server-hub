AWSTemplateFormatVersion: "2010-09-09"
Description: GitHub Actions OIDC deployment role and Lambda runtime secret permissions.

Parameters:
  GitHubRepository:
    Type: String
    Default: calvinkoch00/personal-server-hub
    Description: GitHub owner/repository allowed to deploy from its main branch.
  LambdaFunctionName:
    Type: String
    Default: hetzner-server-controller
  LambdaExecutionRoleName:
    Type: String
    Default: hetzner-server-controller-role-iiub65qe
    Description: Existing execution role used by the Lambda function.
  RuntimeSecretName:
    Type: String
    Default: personal-server-hub/lambda-runtime
  CreateGitHubOidcProvider:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: Set false only if token.actions.githubusercontent.com is already an IAM OIDC provider.

Conditions:
  ShouldCreateGitHubOidcProvider: !Equals [!Ref CreateGitHubOidcProvider, "true"]

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: ShouldCreateGitHubOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1

  LambdaRuntimeSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Ref RuntimeSecretName
      Description: Runtime configuration synchronized from Bitwarden by GitHub Actions.
      SecretString: '{"setup":"replace-on-first-sync"}'

  GitHubActionsDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: personal-server-hub-github-actions
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubRepository}:ref:refs/heads/main
      Policies:
        - PolicyName: deploy-lambda-and-sync-runtime-secrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - lambda:GetFunctionConfiguration
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${LambdaFunctionName}
              - Effect: Allow
                Action:
                  - secretsmanager:DescribeSecret
                  - secretsmanager:PutSecretValue
                Resource: !Ref LambdaRuntimeSecret

  LambdaRuntimeSecretReadPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: read-personal-server-hub-runtime-secret
      Roles:
        - !Ref LambdaExecutionRoleName
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
            Resource: !Ref LambdaRuntimeSecret

Outputs:
  GitHubActionsDeployRoleArn:
    Description: Set this as the GitHub Actions variable AWS_DEPLOY_ROLE_ARN.
    Value: !GetAtt GitHubActionsDeployRole.Arn
  LambdaRuntimeSecretArn:
    Description: Set this as the GitHub Actions variable LAMBDA_RUNTIME_SECRET_ARN.
    Value: !Ref LambdaRuntimeSecret
  LambdaRuntimeSecretName:
    Value: !Ref LambdaRuntimeSecret
